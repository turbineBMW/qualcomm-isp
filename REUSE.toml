version = 1

[[annotations]]
path = [".gitignore", "README.md", "docs/**", "profiles/**", "systemd/**", "tools/**", "runtime/**", "packaging/config.json", "packaging/libcamera/PKGBUILD", "packaging/runtime/PKGBUILD", "vendor/*-source.json", "vendor/runtime-origin.json", "packaging/kernel/ISP-SOURCES.json", "packaging/kernel/omarchy-isp-lab.conf"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Brandon Williams <turbine.bmw@gmail.com>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["packaging/kernel/PKGBUILD", "packaging/kernel/README.md", "packaging/kernel/UPGRADING-7.3.md", "packaging/kernel/.omarchy/package.json"]
precedence = "closest"
SPDX-FileCopyrightText = ["David Heinemeier Hansson", "The Omarchy Authors", "The Arch Linux contributors", "2026 Brandon Williams <turbine.bmw@gmail.com>"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["packaging/kernel/*.patch", "packaging/kernel/config.aarch64"]
precedence = "override"
SPDX-FileCopyrightText = "The Linux kernel contributors; see retained per-file notices and patch author headers"
SPDX-License-Identifier = "GPL-2.0-only"
SPDX-FileComment = "Patch collection distributed under the Linux kernel GPLv2 terms. Embedded per-file notices, permissive license alternatives, and syscall exceptions are retained unchanged and still govern those portions. This annotation prevents historical/removed SPDX lines inside diffs being mistaken for the patch container license."

[[annotations]]
path = ["packaging/kernel/*.sig", "packaging/kernel/keys/**"]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "LicenseRef-Not-Copyrightable"
SPDX-FileComment = "Generated cryptographic signatures and public keys; not executable or private keys."

